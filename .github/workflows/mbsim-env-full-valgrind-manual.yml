name: Full valgrind run with user branchs (Manual)
on:
  workflow_dispatch:
    inputs:
      fmatvecBranch:
        description: "The fmatvec branch to use"
        required: true
        default: "master"
        type: string
      hdf5serieBranch:
        description: "The hdf5serie branch to use"
        required: true
        default: "master"
        type: string
      openmbvBranch:
        description: "The openmbv branch to use"
        required: true
        default: "master"
        type: string
      mbsimBranch:
        description: "The mbsim branch to use"
        required: true
        default: "master"
        type: string
concurrency: 
  group: mbsim-env-daily
  cancel-in-progress: true
env:
  # tagname and servername of remote mbsimenv server
  MBSIMENVTAGNAME: latest
  MBSIMENVSERVERNAME: www.mbsim-env.de
  # connect to this server:port for www, database and filestorage
  MBSIMENVWWW: www.mbsim-env.de:443
  MBSIMENVDATABASE: www.mbsim-env.de:5432
  MBSIMENVFILESTORAGE: www.mbsim-env.de:1122
  # get secrets
  mbsimenvsec_githubAccessToken: ${{secrets.githubAccessToken}}
  mbsimenvsec_mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
  mbsimenvsec_djangoSecretKey: ${{secrets.djangoSecretKey}}
  mbsimenvsec_postgresPassword: ${{secrets.postgresPassword}}
  mbsimenvsec_filestoragePassword: ${{secrets.filestoragePassword}}
jobs:



  buildPartitionedExamples:
    name: B
    uses: ./.github/workflows/mbsim-env-build.yml
    with:
      matrix: |
        {"data":
          [{
            "branches": 
              {"fmatvecBranch": "${{inputs.fmatvecBranch}}", "hdf5serieBranch": "${{inputs.hdf5serieBranch}}", "openmbvBranch": "${{inputs.openmbvBranch}}", "mbsimBranch": "${{inputs.mbsimBranch}}"},
            "os":
              {"buildType": "linux64-dailydebug",
               "image": "mbsimenv/build",
               "runsOn": "ubuntu-22.04",
               "mountBase": "",
               "args": "--disableRunExamples --ccacheSize 0.69",
               "dockerargs": ""},
          }]
        }
      uploadArtifactLocalLcov: true
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}



  examplesPre:
    name: "E pre"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: buildPartitionedExamples
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "normal"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id": 1, "args": "--runExamplesPre"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: '{"runID": -1}'
      downloadArtifactLocalLcov: false
      uploadArtifactLcovdata: false
      downloadArtifactLcovdata: false
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}
  examplesRun:
    name: "E worker"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: [buildPartitionedExamples, examplesPre]
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "normal"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id":  1, "args": "--runExamplesPartition"},
          {"id":  2, "args": "--runExamplesPartition"},
          {"id":  3, "args": "--runExamplesPartition"},
          {"id":  4, "args": "--runExamplesPartition"},
          {"id":  5, "args": "--runExamplesPartition"},
          {"id":  6, "args": "--runExamplesPartition"},
          {"id":  7, "args": "--runExamplesPartition"},
          {"id":  8, "args": "--runExamplesPartition"},
          {"id":  9, "args": "--runExamplesPartition"},
          {"id": 10, "args": "--runExamplesPartition"},
          {"id": 11, "args": "--runExamplesPartition"},
          {"id": 12, "args": "--runExamplesPartition"},
          {"id": 13, "args": "--runExamplesPartition"},
          {"id": 14, "args": "--runExamplesPartition"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: ${{needs.examplesPre.outputs.runexamplesInfo}}
      downloadArtifactLocalLcov: true
      uploadArtifactLcovdata: true
      downloadArtifactLcovdata: false
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}
  examplesPost:
    name: "E post"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: [buildPartitionedExamples, examplesRun, examplesPre]
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "normal"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id": 1, "args": "--runExamplesPost"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: ${{needs.examplesPre.outputs.runexamplesInfo}}
      downloadArtifactLocalLcov: true
      uploadArtifactLcovdata: false
      downloadArtifactLcovdata: true
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}



  examplesPreValgrind:
    name: "E valgrind pre"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: [buildPartitionedExamples, examplesRun] # needs only buildPartitionedExamples;
             # exampleRun is just added to priorize the normal runs over the valgrind run;
             # moreover the dynamic scheduling does not work for parallel --runExamplesPartition jobs;
             # (examplesPreValgrind is not stared before to ensure correct startTime recording in the MBSim-Env database)
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "valgrind"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id": 1, "args": "--runExamplesPre --valgrindExamples"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: '{"runID": -1}'
      downloadArtifactLocalLcov: false
      uploadArtifactLcovdata: false
      downloadArtifactLcovdata: false
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}
  examplesRunValgrind:
    name: "E valgrind worker"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: [buildPartitionedExamples, examplesPreValgrind]
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "valgrind"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id":  1, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  2, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  3, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  4, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  5, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  6, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  7, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  8, "args": "--runExamplesPartition --valgrindExamples"},
          {"id":  9, "args": "--runExamplesPartition --valgrindExamples"},
          {"id": 10, "args": "--runExamplesPartition --valgrindExamples"},
          {"id": 11, "args": "--runExamplesPartition --valgrindExamples"},
          {"id": 12, "args": "--runExamplesPartition --valgrindExamples"},
          {"id": 13, "args": "--runExamplesPartition --valgrindExamples"},
          {"id": 14, "args": "--runExamplesPartition --valgrindExamples"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: ${{needs.examplesPreValgrind.outputs.runexamplesInfo}}
      downloadArtifactLocalLcov: true
      uploadArtifactLcovdata: true
      downloadArtifactLcovdata: false
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}
  examplesPostValgrind:
    name: "E valgrind post"
    uses: ./.github/workflows/mbsim-env-runexamples.yml
    needs: [buildPartitionedExamples, examplesRunValgrind, examplesPreValgrind]
    if: ${{always() && !fromJson(needs.buildPartitionedExamples.outputs.whatToDo).skip}}
    with:
      id: "valgrind"
      # id: is just used for a unique job name
      # args: is passed the as arguments to the job
      matrix: |
        {"data": [
          {"id": 1, "args": "--runExamplesPost --valgrindExamples"}
        ]}
      buildInfo: ${{needs.buildPartitionedExamples.outputs.buildInfo}}
      runexamplesInfo: ${{needs.examplesPreValgrind.outputs.runexamplesInfo}}
      downloadArtifactLocalLcov: true
      uploadArtifactLcovdata: false
      downloadArtifactLcovdata: true
    secrets:
      githubAccessToken: ${{secrets.githubAccessToken}}
      mbsimenvAccessToken: ${{secrets.mbsimenvAccessToken}}
      djangoSecretKey: ${{secrets.djangoSecretKey}}
      postgresPassword: ${{secrets.postgresPassword}}
      filestoragePassword: ${{secrets.filestoragePassword}}
